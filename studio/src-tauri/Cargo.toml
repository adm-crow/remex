[package]
name = "studio"
version = "1.5.1"
description = "A Tauri App"
authors = ["Jeremy Gerbeaud"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-http = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "macros", "rt-multi-thread", "process"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "json"] }
notify = "6"
hostname = "0.3"

[target.'cfg(windows)'.dependencies]
# Job Object APIs (CreateJobObjectW, SetInformationJobObject, AssignProcessToJobObject)
# and the CREATE_NO_WINDOW process-creation flag.
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",          # SECURITY_ATTRIBUTES — gates CreateJobObjectW
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["time", "macros", "rt-multi-thread"] }

