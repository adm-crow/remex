name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Build package
        run: uv build

      # Fail loudly if the version already exists on PyPI — silent skip would mask
      # a forgotten version bump and leave the GitHub release out of sync.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
